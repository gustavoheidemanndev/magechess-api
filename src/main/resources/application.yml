server:
  port: 8080

spring:
  application:
    name: magechess-api
  datasource:
    url: jdbc:h2:file:./data/magechess;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.magechess: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    secret: MageChessSecretKeyForJWTTokenGeneration2024MustBeLongEnoughForHS512
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
